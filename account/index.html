<style>
  /* 계정 페이지 — 웹 로그인(구글)과 계정별 생성 기록(3D 프로그램별). Firebase는 assets/account.js·tools/account, 설계는 gorani-plugin docs/account_plan.md '생성 기록' */
  [hidden] { display: none !important; }   /* display를 준 칸(.state·.banner·label)도 hidden이면 숨긴다 */
  .acct { width: min(880px, 100% - 32px); margin: 40px auto 96px; }
  .state { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 160px; color: var(--ink-2); font-size: 15px; text-align: center; }
  .state .btn { margin-left: 4px; height: 36px; padding: 0 14px; font-size: 14px; }
  .err { color: #B3261E; }

  /* 로그인 */
  .signin { width: min(360px, 100%); margin: 32px auto 0; text-align: center; }   /* 한 칸 — 구글 버튼이 칸 너비만큼이라 글줄 가장자리가 버튼에 맞는다 */
  .signin .mark { --s: 48px; color: var(--ink); }
  .signin h1 { margin-top: 16px; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; }
  .signin .sub { margin-top: 8px; color: var(--ink-2); font-size: 16px; line-height: 24px; text-wrap: balance; }
  .signin .gbtn { display: grid; justify-items: center; margin-top: 28px; min-height: 44px; }
  .signin .msg { margin-top: 20px; color: var(--ink-2); font-size: 14px; line-height: 21px; }
  .signin .terms-note { margin-top: 16px; color: var(--ink-3); font-size: 12px; line-height: 18px; text-wrap: balance; }   /* 버튼 바로 아래 — 약관 동의·가입 한 문장 */
  .signin .terms-note a { color: var(--ink-2); white-space: nowrap; }   /* 링크 이름이 줄 사이에서 쪼개지지 않게 */

  /* 계정 머리 */
  .who { display: flex; align-items: center; gap: 16px; padding-bottom: 28px; border-bottom: 1px solid var(--hair); }
  .avatar { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 20px; }
  .who-text { flex: 1; min-width: 0; }
  .who-email { font-weight: 700; font-size: 18px; line-height: 26px; overflow-wrap: anywhere; }
  .who-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; color: var(--ink-3); font-size: 14px; line-height: 20px; }
  .plan { padding: 0 8px; border: 1px solid var(--hair); border-radius: 999px; color: var(--ink-2); font-size: 12px; line-height: 20px; font-weight: 600; }
  .who .btn { height: 36px; padding: 0 14px; font-size: 14px; }

  /* 구역 */
  .sec { margin-top: 48px; }
  .sec h2 { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -.01em; }
  .sec-sub { margin-top: 4px; color: var(--ink-3); font-size: 14px; line-height: 21px; }
  .hist-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .tools button img { width: 16px; height: 16px; object-fit: contain; }
  .tools button .n { color: var(--ink-3); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tools button[aria-selected="true"] .n { color: var(--ink-2); }
  .star-filter { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer; }
  .star-filter:hover { background: var(--press); color: var(--ink); }
  .star-filter[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .star-filter svg { width: 15px; height: 15px; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-top: 16px; padding: 12px 16px; border-radius: 8px; background: var(--press); color: var(--ink-2); font-size: 14px; line-height: 21px; }
  .banner .btn { height: 32px; padding: 0 12px; font-size: 13px; }
  .hist { margin: 16px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--hair); }
  .hist > li { border-bottom: 1px solid var(--hair); }
  .row { display: flex; align-items: center; gap: 8px; }
  /* 목록 한 줄: 이름과 주소 · 날짜 · ☆ — 프로그램·범위·수준·설정은 펼쳐서 */
  .open { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; flex: 1; min-width: 0; padding: 12px 4px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; }
  .open:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .txt { display: grid; min-width: 0; }
  .name, .addr { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name { font-weight: 600; font-size: 15px; line-height: 22px; }
  .addr { color: var(--ink-3); font-size: 13px; line-height: 19px; }
  .when { color: var(--ink-3); font-size: 13px; line-height: 19px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .star, .edit { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--ink-3); cursor: pointer; }
  .star:hover, .edit:hover { background: var(--press); color: var(--ink); }
  .star[aria-pressed="true"] { color: var(--ink); }
  .star svg { width: 18px; height: 18px; }
  .edit svg { width: 16px; height: 16px; }
  .edit { visibility: hidden; }   /* 이름 바꾸기 — 펼쳤거나 마우스를 올렸을 때만(목록은 단순하게) */
  .hist > li.is-open .edit, .hist > li:hover .edit, .hist > li:focus-within .edit { visibility: visible; }
  /* 펼친 정보 — 제목(15px 굵게) 아래 주소 줄과 같은 13px 단계: 항목 이름은 연하게, 값은 한 단계 진하게 */
  .detail { padding: 0 4px 16px; }
  .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; font-size: 13px; line-height: 20px; }
  .facts dt { color: var(--ink-3); }
  .facts dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .facts a { color: var(--ink-2); }
  /* 이름 바꾸기 — '이름' 줄 그 자리에서 */
  .rename { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 0; }
  .rename .btn { height: 34px; padding: 0 12px; font-size: 13px; }
  .rename input { flex: 1 1 200px; min-width: 0; height: 34px; padding: 0 8px; border: 1px solid var(--hair); border-radius: 6px; font: inherit; font-size: 15px; font-weight: 600; }   /* 제목과 같은 글자 — 제목을 그 자리에서 고친다 */
  .rename input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .empty { margin-top: 16px; padding: 40px 16px; border: 1px dashed var(--hair); border-radius: 12px; text-align: center; }
  .empty b { display: block; font-size: 15px; line-height: 22px; }
  .empty p { margin-top: 6px; color: var(--ink-3); font-size: 14px; line-height: 21px; }

  /* 연결·설정 */
  .lines { margin: 16px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--hair); }
  .lines > li { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--hair); }
  .lines img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .lines .grow { flex: 1; min-width: 0; }
  .lines b { display: block; font-size: 15px; line-height: 22px; }
  .lines span { display: block; color: var(--ink-3); font-size: 13px; line-height: 19px; }
  .lines .btn { flex: none; height: 34px; padding: 0 12px; font-size: 13px; }
  .lines .btn.danger { color: #B3261E; }
  .lines .btn:disabled { opacity: .45; cursor: default; background: var(--surface); }
  .switch { position: relative; flex: none; width: 44px; height: 26px; padding: 0; border: 0; border-radius: 999px; background: #CFCFCF; cursor: pointer; transition: background-color .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .switch:disabled { opacity: .5; cursor: default; }
  .acct-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--hair); color: var(--ink-3); font-size: 13px; }
  .acct-foot a { color: var(--ink-2); }

  /* 확인 창·알림 */
  .ask { width: min(420px, 100% - 32px); padding: 24px; border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 48px -24px rgba(20, 20, 20, .4); }
  .ask::backdrop { background: rgba(20, 20, 20, .32); }
  .ask h3 { font-size: 18px; line-height: 26px; font-weight: 700; }
  .ask p { margin-top: 8px; color: var(--ink-2); font-size: 14px; line-height: 21px; }
  .ask label { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 14px; line-height: 21px; cursor: pointer; }
  .ask label input { margin-top: 3px; }
  .ask .ask-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
  .ask .btn { height: 38px; padding: 0 16px; font-size: 14px; }
  .btn.danger-go { background: #B3261E; border-color: #B3261E; color: #FFFFFF; }
  .btn.danger-go:hover { background: #9A1F19; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 20; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 14px; line-height: 20px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (max-width: 640px) {
    .acct { width: min(880px, 100% - 24px); margin-top: 24px; }
    .who { flex-wrap: wrap; }
    .who-text { flex-basis: calc(100% - 64px); }   /* 로그아웃은 다음 줄로 — 메일이 중간에서 끊기지 않게 */
    .who .btn { margin-left: 64px; }
    .hist-bar { align-items: stretch; }
    .seg.tools { grid-template-columns: repeat(2, 1fr); }   /* 탭 넷: 두 칸씩 두 줄(사이트 공통 .seg는 세 칸) */
    .tools button { justify-content: center; padding: 0 12px; font-size: 14px; }
    .open { gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after, .toast { transition: none; } }
</style>
</head>

  <div class="wrap">
    <a class="brand" id="home" href="../" aria-label="Gorani"><span class="mark" aria-hidden="true"></span>Gorani</a>
    <nav class="nav" id="nav"></nav>

      <a class="icon-btn account-link" id="acct-icon" href="./" aria-current="page"><svg aria-hidden="true"><use href="#i-user"/></svg></a>

<main class="acct" id="main">
  <p class="state" id="state" role="status"><span class="run go" aria-hidden="true"></span><span id="state-text"></span></p>
  <noscript><p class="state">JavaScript를 켜 주세요. · Please enable JavaScript.</p></noscript>

  <section class="signin" id="signin" hidden>
    <span class="mark" aria-hidden="true"></span>
    <h1 id="si-title"></h1>
    <p class="sub" id="si-sub"></p>
    <div class="gbtn" id="gbtn"></div>
    <p class="msg" id="si-msg" role="status" aria-live="polite"></p>
    <p class="terms-note" id="si-fine"></p>
  </section>

  <div id="dash" hidden>
    <section class="who" aria-label="계정">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <div class="who-text">
        <h1 class="who-email" id="email"></h1>
        <p class="who-meta"><span class="plan" id="plan"></span><span id="joined"></span></p>
      </div>
      <button type="button" class="btn" id="logout"></button>
    </section>

    <section class="sec" aria-labelledby="h-history">
      <h2 id="h-history"></h2>
      <p class="sec-sub" id="hist-note"></p>
      <div class="hist-bar">
        <div class="seg tools" id="tools" role="tablist"></div>
        <button type="button" class="star-filter" id="star-filter" aria-pressed="false"><svg aria-hidden="true"><use href="#i-star"/></svg><span></span></button>
      </div>
      <div class="banner" id="sync-banner" hidden><span id="sync-banner-text"></span><button type="button" class="btn" id="sync-banner-on"></button></div>
      <div id="hist" role="tabpanel"></div>
    </section>

    <section class="sec" aria-labelledby="h-conn">
      <h2 id="h-conn"></h2>
      <p class="sec-sub" id="conn-sub"></p>
      <ul class="lines" id="conns"></ul>
    </section>

    <section class="sec" aria-labelledby="h-settings">
      <h2 id="h-settings"></h2>
      <ul class="lines">
        <li>
          <div class="grow"><b id="sync-label"></b><span id="sync-desc"></span></div>
          <button type="button" class="switch" id="sync" role="switch" aria-checked="true" aria-labelledby="sync-label"></button>
        </li>
        <li>
          <div class="grow"><b id="clear-label"></b><span id="clear-desc"></span></div>
          <button type="button" class="btn danger" id="clear"></button>
        </li>
        <li>
          <div class="grow"><b id="del-label"></b><span id="del-desc"></span></div>
          <button type="button" class="btn danger" id="del"></button>
        </li>
      </ul>
    </section>
  </div>

  <footer class="acct-foot" id="foot"></footer>
</main>

      <button type="submit" class="btn go" value="ok" id="ask-ok"></button>

  </form>
</dialog>

  function meters(m) { return m >= 1000 ? (Math.round(m / 100) / 10) + " km" : Math.round(m) + " m"; }

  // ── 기록 한 줄의 글 ──
  function rangeText(it) { return it.radius ? fmt(it.shape === "circle" ? T.circle : T.rect, meters(it.shape === "circle" ? it.radius : it.radius * 2)) : ""; }
  function targetText(it) {
    var t = it.target || {};
    if (it.mode === "lots" && t.pnus && t.pnus.length) return t.pnus.length > 1 ? fmt(T.lotsMore, t.pnus[0], t.pnus.length - 1) : fmt(T.lots, t.pnus[0]);
    if (it.mode === "area" && t.ring) return fmt(T.area, t.ring.length);
    if (it.mode === "point") return T.point;
    return T.modes[it.mode] || T.none;
  }
  function settingsText(it) {
    var o = it.options || {}, out = [];
    if ("terrain_step" in o) out.push(Number(o.terrain_step) > 0 ? fmt(T.step, o.terrain_step) : T.smooth);
    if (o.flatten_site === true) out.push(T.flat);
    if (o.include_minor_buildings === true) out.push(T.minor);
    if (o.geometry_type === "brep") out.push(T.brep);
    return out.join(" · ") || T.none;
  }
  function out2dText(it) {
    var m = it.made_2d || {}, out = [];
    if (m.basemap) out.push(fmt(T.basemap, m.basemap));
    if (Number(m.sheets) > 0) out.push(fmt(T.sheets, m.sheets));
    if (m.tables === true) out.push(T.tables);
    return out.join(" · ");
  }
  function label(it) { return it.label || targetText(it); }
  // 주소 — 페이지 언어 것, 없으면 다른 언어 것(플러그인이 {ko, en}으로 보낸다. 옛 기록은 글 하나)
  function addressOf(it) { var a = it.address || ""; return typeof a === "string" ? a : a[lang] || a.ko || a.en || ""; }

  // ── 그리기 ──
  function visible() {
    return S.items.filter(function (it) { return (S.tool === "all" || it.host === S.tool) && (!S.starOnly || it.star); });
  }
  function renderTools() {
    var count = function (id) { return S.items.filter(function (it) { return id === "all" || it.host === id; }).length; };
    var tabs = [{ id: "all", name: T.all }].concat(TOOLS);
    $("tools").innerHTML = tabs.map(function (t) {
      var sel = t.id === S.tool;
      return '<button type="button" role="tab" id="tab-' + t.id + '" data-tool="' + t.id + '" aria-selected="' + sel + '" aria-controls="hist" tabindex="' + (sel ? 0 : -1) + '">'
        + (t.logo ? '<img src="' + t.logo + '" alt="">' : "") + esc(t.name) + ' <span class="n">' + count(t.id) + "</span></button>";
    }).join("");
    $("hist").setAttribute("aria-labelledby", "tab-" + S.tool);
    var sf = $("star-filter");
    sf.setAttribute("aria-pressed", String(S.starOnly));
    sf.querySelector("use").setAttribute("href", S.starOnly ? "#i-star-on" : "#i-star");
  }
  function itemHtml(it) {
    var tool = toolOf(it.host), open = !!S.open[it.id], id = esc(it.id);
    var html = '<li data-id="' + id + '"' + (open ? ' class="is-open"' : "") + '><div class="row">';
    if (S.editing === it.id) {   // 이름 바꾸기 — 제목 자리에서
      html += '<form class="rename" data-act="save"><input type="text" maxlength="80" aria-label="' + esc(T.rename) + '" value="' + esc(label(it)) + '">'
        + '<button type="submit" class="btn go">' + esc(T.save) + '</button><button type="button" class="btn" data-act="cancel">' + esc(T.cancel) + "</button></form>";
    } else {
      html += '<button type="button" class="open" aria-expanded="' + open + '" aria-controls="d-' + id + '">'
        + '<span class="txt"><span class="name">' + esc(label(it)) + '</span><span class="addr">' + esc(addressOf(it) || rangeText(it)) + "</span></span>"
        + '<span class="when">' + esc(listDate(it.built_at)) + "</span></button>"
        + '<button type="button" class="edit" data-act="rename" aria-label="' + esc(T.rename + ": " + label(it)) + '" title="' + esc(T.rename) + '"><svg aria-hidden="true"><use href="#i-edit"/></svg></button>'
        + '<button type="button" class="star" data-act="star" aria-pressed="' + !!it.star + '" aria-label="' + esc(T.star + ": " + label(it)) + '"><svg aria-hidden="true"><use href="' + (it.star ? "#i-star-on" : "#i-star") + '"/></svg></button>';
    }
    html += "</div>";
    if (open) {
      var c = it.center, place = esc(addressOf(it) || T.noAddr)
        + (c ? ' · <a href="https://www.openstreetmap.org/?mlat=' + c[1] + "&amp;mlon=" + c[0] + "#map=17/" + c[1] + "/" + c[0] + '" target="_blank" rel="noopener">' + esc(T.openMap) + "</a>" : "");
      var facts = [[T.fAddr, place, true], [T.fTarget, targetText(it)], [T.fRange, rangeText(it) || T.none], [T.fLevel, it.detail === "advanced" ? T.adv : it.detail === "basic" ? T.basic : T.none],
        [T.fSettings, settingsText(it)], [T.f2d, out2dText(it) || T.none], [T.fMadeIn, tool.name + (it.version ? " " + it.version : "")], [T.fMadeAt, parse(it.built_at) ? fullFmt.format(parse(it.built_at)) : T.none]];
      html += '<div class="detail" id="d-' + id + '">'   // 펼친 기록 — 글로만(대상지 그림은 지도 없이는 읽기 어려워 뺐다. 위치는 주소와 '지도에서 보기')
        + '<dl class="facts">' + facts.map(function (f) { return "<dt>" + esc(f[0]) + "</dt><dd>" + (f[2] ? f[1] : esc(f[1])) + "</dd>"; }).join("") + "</dl>"
        + "</div>";
    }
    return html + "</li>";
  }
  function renderList() {
    var list = visible(), html = "";
    if (!list.length) {
      var tool = toolOf(S.tool);
      var e = S.starOnly ? [T.emptyStar, T.emptyStarSub] : S.tool === "all" ? [T.emptyAll, T.emptyAllSub] : [fmt(T.emptyTool, tool.name), fmt(T.emptyToolSub, tool.name)];
      html = '<div class="empty"><b>' + esc(e[0]) + "</b><p>" + esc(e[1]) + "</p></div>";
    } else {
      html = '<ul class="hist">' + list.map(itemHtml).join("") + "</ul>";
    }
    $("hist").innerHTML = html;
    $("clear").disabled = !S.items.length;
  }
  function renderSync() {
    $("sync").setAttribute("aria-checked", String(S.on));
    $("sync-banner").hidden = S.on || !S.available;
    var unavailable = document.getElementById("unavailable");
    if (!S.available && !unavailable) {
      unavailable = document.createElement("p"); unavailable.id = "unavailable"; unavailable.className = "banner"; unavailable.textContent = T.unavailable;
      $("sync-banner").after(unavailable);
    } else if (S.available && unavailable) unavailable.remove();
  }
  function renderConns() {
    var list = (S.me && S.me.connections) || [];
    $("conns").innerHTML = list.length ? list.map(function (c) {
      var tool = toolOf(c.host);
      return '<li data-conn="' + esc(c.id) + '">' + (tool.logo ? '<img src="' + tool.logo + '" alt="">' : "") + '<div class="grow"><b>' + esc(tool.name) + "</b><span>"
        + esc(fmt(T.connMeta, c.version || T.none, shortDay(c.created), shortDay(c.seen))) + '</span></div><button type="button" class="btn" data-act="disconnect">' + esc(T.disconnect) + "</button></li>";
    }).join("") : '<li><div class="grow"><span>' + esc(T.connEmpty) + "</span></div></li>";
  }
  function renderAll() {
    var me = S.me;
    setAccountIcon(me.email);
    $("avatar").textContent = me.email.charAt(0).toUpperCase();
    $("email").textContent = me.email;
    $("plan").textContent = me.entitlement.plan_name;
    var joined = parse(me.created);
    $("joined").textContent = joined ? fmt(T.joined, dateFmt.format(joined)) : "";
    renderTools(); renderSync(); renderList(); renderConns();
  }

  // ── 불러오기·로그인 ──
  function load() {
    if (!A.saved()) return showSignIn();
    if ($("dash").hidden) show("state");
    return Promise.all([call("me"), call("history_list")]).then(function (res) {
      S.me = res[0];
      S.items = res[1].items || [];
      S.on = res[1].on !== false;
      S.available = res[1].available !== false;
      renderAll();
      show("dash");
    }).catch(function (err) {
      if (err && err.handled) return;
      show("state", T.fail, load);
    });
  }
  function signOut(text) {
    A.store(null);
    S.me = null; S.items = []; S.open = {}; S.editing = "";
    showSignIn(text);
  }
  var gisReady = false;
  function showSignIn(text) {
    show("signin");
    setAccountIcon("");
    $("si-msg").textContent = text || "";
    $("si-msg").className = "msg";
    if (!A.ready) { $("si-msg").textContent = T.unready; $("si-msg").className = "msg err"; return; }
    if (gisReady) return;
    A.loadGis(function () {
      gisReady = true;
      google.accounts.id.initialize({ client_id: A.clientId, callback: onCredential, auto_select: false, context: "signin" });
      google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", shape: "pill", text: "continue_with", locale: lang,
        width: Math.min(360, $("gbtn").clientWidth || 360) });   // 칸 너비만큼(구글 버튼은 200~400px)
    }, function () { $("si-msg").textContent = T.gis; $("si-msg").className = "msg err"; });
  }
  function onCredential(resp) {
    $("si-msg").textContent = T.working; $("si-msg").className = "msg";
    A.login(resp.credential, lang).then(function (res) {
      var deleting = S.deleting; S.deleting = "";
      if (deleting && deleting === res.user.email) return call("delete").then(function () { signOut(T.deleted); }).catch(failToast);   // 같은 계정으로 다시 로그인했으면 탈퇴를 이어 간다
      toast(res.user && res.user.new ? T.welcome : T.signedIn);
      load();
    }).catch(function (err) {
      $("si-msg").textContent = err && err.message === "too_fast" ? T.busy : T.loginFail;
      $("si-msg").className = "msg err";
    });
  }

  // ── 동작 ──
  $("logout").addEventListener("click", function () {
    signOut(T.loggedOut);   // 이 브라우저의 열쇠만 지운다(플러그인 연결은 그대로 — 끊으려면 '연결된 프로그램'에서)
  });
  $("tools").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tool]"); if (!b) return;
    pickTool(b.getAttribute("data-tool"));
  });
  $("tools").addEventListener("keydown", function (e) {   // 탭: 왼쪽·오른쪽 화살표로 옮긴다
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var ids = ["all"].concat(TOOLS.map(function (t) { return t.id; }));
    var next = ids[(ids.indexOf(S.tool) + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    pickTool(next);
    $("tab-" + next).focus();
    e.preventDefault();
  });
  function pickTool(id) {
    S.tool = id; S.editing = "";
    history.replaceState(null, "", location.pathname + location.search + (id === "all" ? "" : "#" + id));
    renderTools(); renderList();
  }
  $("star-filter").addEventListener("click", function () { S.starOnly = !S.starOnly; renderTools(); renderList(); });
  function find(id) { return S.items.filter(function (it) { return it.id === id; })[0]; }
  $("hist").addEventListener("click", function (e) {
    var li = e.target.closest("li[data-id]"); if (!li) return;
    var it = find(li.getAttribute("data-id")); if (!it) return;
    if (e.target.closest(".open")) {
      S.open[it.id] = !S.open[it.id];
      if (!S.open[it.id] && S.editing === it.id) S.editing = "";
      renderList();
      var again = $("hist").querySelector('li[data-id="' + CSS.escape(it.id) + '"] .open'); if (again) again.focus();
      return;
    }
    var actEl = e.target.closest("[data-act]"), act = actEl ? actEl.getAttribute("data-act") : "";
    if (act === "star") {
      it.star = !it.star; renderList();
      var starBtn = $("hist").querySelector('li[data-id="' + CSS.escape(it.id) + '"] .star'); if (starBtn) starBtn.focus();
      call("history_update", { id: it.id, star: it.star }).catch(function (err) { it.star = !it.star; renderList(); failToast(err); });
    } else if (act === "rename") {
      S.editing = it.id; renderList();
      var input = $("hist").querySelector(".rename input"); if (input) { input.focus(); input.select(); }
    } else if (act === "cancel") {
      S.editing = ""; renderList();
    }
  });
  $("hist").addEventListener("submit", function (e) {
    e.preventDefault();
    var li = e.target.closest("li[data-id]"), it = li && find(li.getAttribute("data-id"));
    var value = e.target.querySelector("input").value.trim();
    if (!it) return;
    if (!value || value === label(it)) { S.editing = ""; renderList(); return; }
    var before = it.label;
    it.label = value; S.editing = ""; renderList();
    call("history_update", { id: it.id, label: value }).then(function () { toast(T.renamed); }).catch(function (err) { it.label = before; renderList(); failToast(err); });
  });
  $("hist").addEventListener("keydown", function (e) {
    if (e.key === "Escape" && e.target.closest(".rename")) { S.editing = ""; renderList(); }
  });
  $("clear").addEventListener("click", function () {
    ask({ title: fmt(T.clearQ, S.items.length), body: T.clearBody, ok: T.del, danger: true }).then(function (r) {
      if (!r.ok) return;
      call("history_delete", { all: true }).then(function () {
        S.items = []; S.open = {}; S.editing = "";
        renderTools(); renderList(); toast(T.cleared);
      }).catch(failToast);
    });
  });
  function setSync(on, clear) {
    $("sync").disabled = true;
    return call("set_history_sync", { on: on, clear: !!clear }).then(function () {
      S.on = on;
      if (clear) { S.items = []; renderTools(); renderList(); }
      renderSync(); toast(on ? T.syncOnDone : T.syncOffDone);
    }).catch(failToast).then(function () { $("sync").disabled = false; });
  }
  $("sync").addEventListener("click", function () {
    if (!S.on) return setSync(true);
    ask({ title: T.syncOffQ, body: T.syncOffBody, ok: T.turnOff, check: S.items.length ? fmt(T.syncOffClear, S.items.length) : "" }).then(function (r) {
      if (r.ok) setSync(false, r.checked);
    });
  });
  $("sync-banner-on").addEventListener("click", function () { setSync(true); });
  $("conns").addEventListener("click", function (e) {
    var li = e.target.closest("li[data-conn]"); if (!li || !e.target.closest("[data-act=disconnect]")) return;
    var id = li.getAttribute("data-conn"), c = S.me.connections.filter(function (x) { return x.id === id; })[0];
    ask({ title: fmt(T.disconnectQ, toolOf(c.host).name), body: T.disconnectBody, ok: T.disconnect, danger: true }).then(function (r) {
      if (!r.ok) return;
      call("logout", { token_id: id }).then(function () {
        S.me.connections = S.me.connections.filter(function (x) { return x.id !== id; });
        renderConns(); toast(T.disconnected);
      }).catch(failToast);
    });
  });
  $("del").addEventListener("click", function () {
    ask({ title: T.delQ, body: T.delBody, ok: T.delLabel, danger: true }).then(function (r) {
      if (!r.ok) return;
      call("delete").then(function () { signOut(T.deleted); }).catch(function (err) {
        if (!err || err.message !== "reauth") return failToast(err);
        S.deleting = S.me.email;   // 구글로 한 번 더 로그인하면 이어서 지운다
        A.store(null); S.me = null; S.items = []; S.open = {}; S.editing = "";
        showSignIn(T.reauth);
      });
    });
  });

  load();
})();
</script>
</body>
</html>
