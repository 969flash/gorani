<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorani</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../assets/style.css?v=202611091200">
<style>
  /* 플러그인 받는 곳(127.0.0.1)이 로그인을 마치고 넘기는 곳 — ?ok=1|0&lang= */
  .login { width: min(400px, 100% - 32px); margin: 72px auto; text-align: center; }
  .login .mark { --s: 48px; color: var(--ink); }
  .login h1 { margin-top: 16px; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; }
  .login .sub { margin-top: 8px; color: var(--ink-2); font-size: 15px; line-height: 22px; }
</style>
</head>
<body>
<main class="login">
  <a href="../../" aria-label="Gorani"><span class="mark" aria-hidden="true"></span></a>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), ok = q.get("ok") === "1", lang = q.get("lang") === "ko" ? "ko" : "en";
  var T = {
    ko: ok ? ["로그인했습니다", "이 탭을 닫고 Gorani로 돌아가세요."] : ["로그인하지 못했습니다", "Gorani 패널에서 [구글로 로그인]을 다시 눌러 주세요."],
    en: ok ? ["You’re signed in", "Close this tab and return to Gorani."] : ["Could not sign in", "Press [Sign in with Google] in the Gorani panel again."]
  }[lang];
  document.documentElement.lang = lang;
  document.title = T[0] + " · Gorani";
  document.getElementById("title").textContent = T[0];
  document.getElementById("sub").textContent = T[1];
})();
</script>
</body>
</html>
