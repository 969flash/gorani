<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorani</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../assets/style.css?v=202611091200">
<style>
  /* 플러그인 받는 곳(127.0.0.1)이 로그인을 마치고 넘기는 곳 — ?ok=1|0, 로그인 쪽 고장이면 ?fallback=1(고급을 열었다), &lang&h */
  /* 로그인 페이지와 같은 카드 — 마크에 결과 표시(완료 ✓·실패 !), 고장은 풀 뜯으러 가는 고라니 */
  body { background: #F6F6F6; }
  .login { width: min(400px, 100% - 32px); margin: max(48px, 12vh) auto 48px; padding: 40px 32px 36px; border: 1px solid var(--hair); border-radius: 20px;
    background: var(--surface); box-shadow: 0 1px 2px rgba(20, 20, 20, .04), 0 16px 40px -20px rgba(20, 20, 20, .16); text-align: center; }
  .login .home { position: relative; display: inline-flex; color: var(--ink); }
  .login .mark { --s: 44px; }
  .login .run { --w: 64px; --h: 48px; }
  .login .badge { position: absolute; right: -10px; bottom: -4px; display: grid; place-items: center; width: 22px; height: 22px; border: 2px solid var(--surface); border-radius: 50%;
    background: var(--ink); color: var(--on-ink); }
  .login .badge svg { width: 12px; height: 12px; }
  .login .badge.err { background: #B3261E; }
  .login h1 { margin-top: 16px; font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .login .sub { margin-top: 8px; color: var(--ink-2); font-size: 15px; line-height: 22px; white-space: pre-line; }
  @media (max-width: 480px) { .login { margin-top: 24px; padding: 32px 20px 28px; } }
  @media (prefers-reduced-motion: reduce) { .login .run.go { animation: none; } }
</style>
</head>
<body>
<main class="login">
  <a class="home" id="home" href="../../" aria-label="Gorani"><span class="mark" aria-hidden="true"></span></a>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), ok = q.get("ok") === "1", fallback = q.get("fallback") === "1", lang = q.get("lang") === "ko" ? "ko" : "en";
  var T = {   // fallback — 로그인 쪽 고장이라 플러그인이 이번 고급을 열었다(계획 문서 '로그인에 기대지 않기', 문구는 패널 토스트와 같다)
    ko: fallback ? ["로그인 서버가 풀 뜯으러 갔습니다", "이번 고급은 그냥 열어 둡니다.\n이 탭을 닫고 Gorani로 돌아가세요."]
      : ok ? ["로그인했습니다", "이 탭을 닫고 Gorani로 돌아가세요."] : ["로그인하지 못했습니다", "Gorani 패널에서\n[구글로 로그인]을 다시 눌러 주세요."],
    en: fallback ? ["The sign-in server wandered off to graze", "Advanced is open this time.\nClose this tab and return to Gorani."]
      : ok ? ["You’re signed in", "Close this tab and return to Gorani."] : ["Could not sign in", "Press [Sign in with Google]\nin the Gorani panel again."]
  }[lang];
  document.documentElement.lang = lang;
  document.title = T[0] + " · Gorani";
  document.getElementById("title").textContent = T[0];
  document.getElementById("sub").textContent = T[1];
  var home = document.getElementById("home");
  if (fallback) home.innerHTML = '<span class="run go" aria-hidden="true"></span>';   // 풀 뜯으러 간 고라니
  else home.insertAdjacentHTML("beforeend", ok   // 마크 아래 오른쪽에 결과 표시
    ? '<span class="badge" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.5l4.5-5"/></svg></span>'
    : '<span class="badge err" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2.8v3.8M6 9.2v.01"/></svg></span>');
})();
</script>
</body>
</html>
