<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorani</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../assets/style.css?v=202611181800">
<style>
  /* 플러그인 받는 곳(127.0.0.1)이 로그인을 마치고 넘기는 곳 — ?ok=1|0, 로그인 쪽 고장이면 ?fallback=1(고급을 열었다), &lang&h */
  .login { width: min(400px, 100% - 32px); margin: 72px auto; text-align: center; }
  .login .mark { --s: 48px; color: var(--ink); }
  .login h1 { margin-top: 16px; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; }
  .login .sub { margin-top: 8px; color: var(--ink-2); font-size: 15px; line-height: 22px; }
  .login .btn { margin-top: 28px; height: 40px; padding: 0 16px; font-size: 14px; }
  .login .btn[hidden] { display: none; }
</style>
</head>
<body>
<main class="login">
  <a href="../../" aria-label="Gorani"><span class="mark" aria-hidden="true"></span></a>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <a class="btn" id="history" hidden></a>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), ok = q.get("ok") === "1", fallback = q.get("fallback") === "1", lang = q.get("lang") === "ko" ? "ko" : "en";
  var host = q.get("h") || "";   // 로그인을 연 프로그램 — 플러그인이 h로 넘긴다. 없으면 /login/이 넘기기 직전에 이 탭에 적어 둔 것
  try { host = host || sessionStorage.getItem("gorani_login_host") || ""; } catch (e) {}
  var back = {
    ko: { rhino: "Rhino로", sketchup: "SketchUp으로", archicad: "Archicad로" }[host] || "Gorani 패널로",
    en: { rhino: "Rhino", sketchup: "SketchUp", archicad: "Archicad" }[host] || "the Gorani panel"
  }[lang];
  var T = {   // fallback — 로그인 쪽 고장이라 플러그인이 이번 고급을 열었다(계획 문서 '로그인에 기대지 않기', 문구는 패널 토스트와 같다)
    ko: fallback ? ["로그인 서버가 풀 뜯으러 갔습니다", "이번 고급은 그냥 열어 둡니다. " + back + " 돌아가 작업을 이어 가세요."]
      : ok ? ["로그인 완료", back + " 돌아가 작업을 이어 가세요.", "생성 기록 보기"] : ["로그인 실패", "Gorani 패널에서 [Google 계정으로 로그인]을 다시 눌러 주세요."],
    en: fallback ? ["The sign-in server wandered off to graze", "Advanced is open this time. Go back to " + back + " to keep working."]
      : ok ? ["You’re signed in", "Go back to " + back + " to keep working.", "View generation history"] : ["Sign-in failed", "Press [Sign in with Google] in the Gorani panel again."]
  }[lang];
  document.documentElement.lang = lang;
  document.title = T[0] + " · Gorani";
  document.getElementById("title").textContent = T[0];
  document.getElementById("sub").textContent = T[1];
  if (ok) {   // 같은 브라우저에 웹 로그인도 남아 있어 계정 페이지가 바로 열린다
    var link = document.getElementById("history");
    link.textContent = T[2];
    link.href = "../../account/?lang=" + lang;
    link.hidden = false;
  }
})();
</script>
</body>
</html>
