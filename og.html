<!doctype html>
<!-- 공유 미리보기 이미지(1200×630) — 이름·문구를 바꾸면 다시 찍는다. 영어판은 ?en
     C="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
     "$C" --headless=new --force-prefers-reduced-motion --hide-scrollbars --window-size=1200,630 --screenshot=assets/og.png "file://$PWD/og.html"
     "$C" --headless=new --force-prefers-reduced-motion --hide-scrollbars --window-size=1200,630 --screenshot=assets/og-en.png "file://$PWD/og.html?en" -->
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 맥이 다크 모드여도 밝은 색으로 찍는다 — style.css :root 밝은 값 */
  :root { --paper: #F5F7FA; --grid: #E9EEF4; --grid-major: #DDE4EE; --surface: #FFFFFF; --ink: #111418; --ink-2: #465061; --ink-3: #7D8798; --hair: #C9D2DE; --line: #A9C0F2; --blue: #0057FF; --blue-dn: #0044CC; --blue-ink: #0047D6; --blue-wash: #E9F0FF; --wall-a: #E6EBF2; --wall-b: #CBD4E0; color-scheme: light; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card { position: absolute; inset: 32px; border: 1.5px solid var(--ink); background: var(--surface); display: flex; align-items: center; padding: 0 0 0 48px; }
  .text { flex: 0 0 540px; display: flex; flex-direction: column; height: 100%; padding: 52px 0 44px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 21px; }
  .brand svg { width: 28px; height: 28px; }
  h1 { font-size: 60px; line-height: 1.22; letter-spacing: -0.02em; margin: auto 0; }
  .lead { font-size: 18px; color: var(--ink-2); margin: 0; line-height: 1.6; }
  .drawing { flex: 1; height: 440px; margin: 40px 0 0; border: 0; background: none; }
  #axon { width: 100%; height: 100%; }
</style></head>
<body>
<div class="card">
  <div class="text">
    <div class="brand"><svg viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" fill="#fff" stroke="#111418" stroke-width="2"/><path d="M1 11h30M1 21h30M11 1v30M21 1v30" stroke="#C9D2DE" stroke-width="1.5"/><path d="M11 11h10v10H11z" fill="#0057FF"/></svg>Gorani</div>
    <h1 id="title">필지를 고르면<br><em>주변 건물과 지형</em>이<br>Rhino에 들어옵니다.</h1>
    <p class="lead" id="lead">무료 Rhino 8 플러그인 · 패키지 매니저에서 Gorani 검색</p>
  </div>
  <figure class="drawing"><canvas id="axon" data-site="대상지" data-radius="반경 {r}"></canvas></figure>
</div>
<script>
  if (location.search === "?en") {
    document.documentElement.lang = "en";
    document.getElementById("title").innerHTML = "<em>The city around<br>your site</em>,<br>modeled in Rhino.";
    document.getElementById("lead").textContent = "Free Rhino 8 plugin · search Gorani in Package Manager";
    document.getElementById("axon").dataset.site = "Site";
    document.getElementById("axon").dataset.radius = "Radius {r}";
  }
</script>
<script src="assets/site.js"></script>
</body></html>
